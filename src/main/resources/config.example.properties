# ===================================================================
# Autonomous AI Research Assistant - Configuration Template
# ===================================================================
# DO NOT COMMIT ACTUAL PASSWORDS OR CREDENTIALS IN THIS FILE.
# Set MONGODB_URI as an environment variable for production:
# export MONGODB_URI="mongodb+srv://<username>:<password>@cluster0.example.mongodb.net/?retryWrites=true&w=majority"
# Or on Windows PowerShell:
# $env:MONGODB_URI = "mongodb+srv://<username>:<password>@cluster0.example.mongodb.net/?retryWrites=true&w=majority"
# ===================================================================

# MongoDB Connection (Optional - defaults to local file fallback if unreachable)
# Leave commented or empty to use local FileRepository mode
# mongodb.uri=mongodb://localhost:27017
mongodb.database=antigravity_research

# Retrieval & Ranking Parameters
top.k=5
min.score=0.005

# Inverted Index & NLP Settings
corpus.path=data/sample
evaluation.ground_truth.path=data/evaluation/ground_truth.json

# TextRank Summarization Settings
textrank.damping.factor=0.85
textrank.max.iterations=25
textrank.convergence.threshold=0.0001
textrank.summary.sentences=3

# Logging Level (INFO, WARNING, SEVERE, FINE)
log.level=INFO
